name: Metrics
on:
  # Schedule daily updates
  schedule: [{cron: "0 0 * * *"}]
  # (optional) Run workflow manually
  workflow_dispatch:
  # (optional) Run workflow when pushing on master/main
  push: {branches: ["master", "main"]}
jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          # 100 repos per query makes GitHub's GraphQL return 502, which renders zero stars and languages
          repositories_batch: 25
          # plugin_achievements removed: it queries Projects (classic), which GitHub sunset
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          extras_css: |
            .field svg {
              fill: #b3361b;
            }
            .field {
              color: #8a8579;
            }
            h1, h2, h3 {
              color: #b3361b !important;
            }
          extras_js: |
            for (const {a, b} of [
              {a:"#216e39", b:"#8f2a14"},
              {a:"#30a14e", b:"#b3361b"},
              {a:"#40c463", b:"#d9735a"},
              {a:"#9be9a8", b:"#f3c9b9"},
              {a:"#ebedf0", b:"#e3dfd5"},
            ])
            document.querySelectorAll(`svg g [fill="${a}"]`).forEach(node => node.setAttribute("fill", b))
          plugin_languages: yes
          plugin_languages_ignored: >-
            html, css, tex, less, dockerfile, makefile, qmake, lex, cmake, shell,
            gnuplot
          plugin_languages_details: bytes-size, percentage
          plugin_languages_limit: 4
